name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ar
            country: SA
          - language: en
            country: US
    env:
      JAVA_TOOL_OPTIONS: -Duser.language=${{ matrix.language }} -Duser.country=${{ matrix.country }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          printf 'ANDROID_HOME=%s\nANDROID_USER_HOME=%s\n' "$ANDROID_HOME" "$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --max-time 180 \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            --output "$RUNNER_TEMP/android-commandlinetools.zip"
          printf '%s  %s\n' e025545c62a8e64c7559119566a569fb1dec5f60 \
            "$RUNNER_TEMP/android-commandlinetools.zip" | sha1sum --check -
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/android" --no-metrics --sdk="$ANDROID_HOME" \
            sdk install platforms/android-37.2 build-tools/37.0.0 platform-tools
      - name: Build and verify
        run: >-
          bash ./gradlew :app:assembleDebug :app:assembleRelease
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
          --console=plain --no-daemon
